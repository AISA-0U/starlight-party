# Netlify 构建/部署配置（静态站点，无构建步骤）
# 缓存策略说明：
# - 带内容指纹的照片产物：一年 immutable
# - 无指纹的脚本/样式：保持可校验（must-revalidate），部署后能拿到新代码
# - Service Worker：no-cache，确保及时更新
# - HTML：CDN 层 stale-while-revalidate，浏览器侧仍为 max-age=0

[[headers]]
  for = "/assets/photos/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/photos/photos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"
